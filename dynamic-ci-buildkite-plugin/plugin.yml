name: Dynamic CI
description:
  Skips the steps your diff does not need, using your own CI history. Marks them
  skipped at pipeline-upload time, before an agent is acquired.
author: https://github.com/trunk-io

requirements:
  - buildkite-agent
  - bash
  - curl

configuration:
  properties:
    mode:
      description:
        How the plugin attaches. `filter` (default) leaves your command alone and
        puts `trunk-dynamic-ci-filter` on PATH for you to pipe your pipeline
        through. `step` decides about one individual step.
      type: string
      enum: [filter, step]
      default: filter
    token-env:
      description:
        Name of the environment variable holding your Trunk organization API
        token. Never put the token itself in plugin configuration — configuration
        is interpolated into the uploaded pipeline and shown in the Buildkite UI.
      type: string
      default: TRUNK_TOKEN
    only-keys:
      description:
        Comma-separated step keys to consider, narrowing the plugin to a subset
        of the pipeline. Every other step runs untouched. Use this to trial
        Dynamic CI on one expensive step while still getting a real skip, taken
        before the step is dispatched.
      type: string
    exclude-keys:
      description:
        Comma-separated step keys to never skip. Trunk still runs them; it just
        never decides about them. Use this for steps that must always run — a
        deploy, a release gate — while the rest of the pipeline is considered.
        Applied after only-keys, so a key in both is excluded.
      type: string
    debug:
      description:
        Print the requested step keys, the request body and the plan to the
        build log, in collapsed groups. Everything goes to stderr, so it is safe
        in filter mode. Off by default.
      type: boolean
      default: false
    ignore-signals:
      description: Comma-separated signal identifiers to exclude from the recommendation.
      type: string
  additionalProperties: false

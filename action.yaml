name: Trunk Dynamic CI Filter
description:
  Recommends which CI jobs to run for the current diff, using your org's own CI
  history. Runs as a pre-step or pre-job and emits a per-job run/skip output.
author: trunk.io
branding:
  icon: filter
  color: purple

inputs:
  token:
    description: Trunk organization API token.
    required: true
  job-names:
    description:
      Job(s) to scope the recommendation to (pre-step mode) — a single job name
      or a comma-separated list of job names. Leave unset to return
      recommendations for all known job names in this workflow.
    required: false
  ignore-signals:
    description:
      Optional comma-separated list of signal identifiers to exclude from the
      recommendation. Valid identifiers are estimated-cost,
      previous-result-on-pr, historical-pass-rate, diff-driven-volatility,
      force-override, merge-failure, and mid-pr-stack. An unrecognized
      identifier makes the action fail open (recommend running everything)
      rather than silently ignore the setting.
    required: false

# Per-job outputs are set at runtime and so cannot be declared here. See the
# README: keys are normalized job names, and conditionals must test != 'false'.

runs:
  using: node24
  main: dist/index.js

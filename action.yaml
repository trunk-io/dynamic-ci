name: Trunk Dynamic CI Filter
description:
  Recommends which CI jobs to run for the current diff, using your org's own CI
  history. Runs as a filter job before your work and emits a per-job run/skip
  output.
author: trunk.io
branding:
  icon: filter
  color: purple

inputs:
  token:
    description: Trunk organization API token.
    required: true
  job-keys:
    description: Job(s) to scope the recommendation to — a single job key or a
      comma-separated list of job keys, as written under `jobs:` in the
      workflow file (the value `github.job` reports). Leave unset to return
      recommendations for every keyed job in this workflow.
    required: false
  ignore-signals:
    description:
      Optional comma-separated list of signal identifiers to exclude from the
      recommendation. Valid identifiers are estimated-cost,
      previous-result-on-pr, historical-pass-rate, diff-driven-volatility,
      force-override, merge-failure, mid-pr-stack, and required-check. An
      unrecognized identifier makes the action fail open (recommend running
      everything) rather than silently ignore the setting.
    required: false
  impacts:
    description:
      A JSON list of how much of the codebase the change affects, one entry per
      measure your build tool computes, each with source (lowercase letters,
      digits, '.', '_' and '-'), count (required unless all is true) and all
      (true when the change affects everything). For example
      [{"source":"tainted-packages","count":734}]. Jobs with Trunk's impact
      reach signal on lean toward running a broad change. Leave it unset when
      your tool computed nothing.
    required: false
  matrices:
    description: >-
      A JSON object of job key to the rows a planner job built for that job's
      runtime matrix, each the planner's output as written, for example
      {"tests": [{"suite": "api"}, {"suite": "web"}]}. Pass the planner's
      output unchanged. Trunk then decides each variation of the job, and the
      <job>-matrix and <job>-include outputs keep only the rows that run. Which
      fields name a variation is set in Trunk, not here. Leave it unset for
      matrices written in the workflow file.
    required: false
  enable-annotation:
    description:
      Post the recommendation to the workflow run — its annotation list and the
      job summary. The step's logs are written either way.
    required: false
    default: "false"
  github-token:
    description:
      Token for reading the pull request's changed files and the workflow file
      when the checkout does not have them. Needs the pull-requests read and
      contents read permissions; without them, Trunk reads the changed files
      itself and decides matrix jobs as a whole.
    required: false
    default: ${{ github.token }}
  gh-action-ref:
    description:
      The ref of the action being used. Defaults to the value GitHub resolves for
      this step; reported with telemetry so a bad release can be told from a bad
      backend.
    required: false
    default: ${{ github.action_ref }}

# Per-job outputs are set at runtime and so cannot be declared here. See the
# README: each output is named for its job key, and conditionals must test
# != 'false'.

runs:
  using: node24
  main: dist/index.js

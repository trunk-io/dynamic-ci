name: Trunk Dynamic CI Filter
description:
  Recommends which CI jobs to run for the current diff, using your org's own CI
  history. Runs as a pre-step or pre-job and emits a per-job run/skip output.
author: trunk.io
branding:
  icon: filter
  color: purple

inputs:
  token:
    description: Trunk organization API token.
    required: true
  job-keys:
    description:
      Job(s) to scope the recommendation to (pre-step mode) — a single job key
      or a comma-separated list of job keys, as written under `jobs:` in the
      workflow file (the value `github.job` reports). Leave unset to return
      recommendations for every keyed job in this workflow.
    required: false
  ignore-signals:
    description:
      Optional comma-separated list of signal identifiers to exclude from the
      recommendation. Valid identifiers are estimated-cost,
      previous-result-on-pr, historical-pass-rate, diff-driven-volatility,
      force-override, merge-failure, mid-pr-stack, and required-check. An
      unrecognized identifier makes the action fail open (recommend running
      everything) rather than silently ignore the setting.
    required: false
  impact-count:
    description:
      How many units your build tool says the change affects (packages,
      targets, test files or tests). Send the same measure on every run.
      Required unless impact-all is true. Send 0 when nothing is affected, and
      leave it unset when your tool did not compute it. Jobs with Trunk's diff
      impact signal on lean toward running a broad change.
    required: false
  impact-all:
    description:
      Set to true when your build tool says the change affects everything, or
      could not work out what is affected. Such a change always runs on jobs
      with the impact reach signal on.
    required: false
  impact-source:
    description:
      A label for the measure, such as nx-affected-projects. At most 64
      characters.
    required: false
  enable-annotation:
    description:
      Post the recommendation to the workflow run — its annotation list and the
      job summary. The step's logs are written either way.
    required: false
    default: "false"
  github-token:
    description:
      Token for reading the pull request's changed files when the checkout does
      not have both commits. Needs the pull-requests read permission.
    required: false
    default: ${{ github.token }}
  gh-action-ref:
    description:
      The ref of the action being used. Defaults to the value GitHub resolves for
      this step; reported with telemetry so a bad release can be told from a bad
      backend.
    required: false
    default: ${{ github.action_ref }}

# Per-job outputs are set at runtime and so cannot be declared here. See the
# README: each output is named for its job key, and conditionals must test
# != 'false'.

runs:
  using: node24
  main: dist/index.js

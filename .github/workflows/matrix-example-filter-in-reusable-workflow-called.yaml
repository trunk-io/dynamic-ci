# Called by matrix-example-filter-in-reusable-workflow.yaml; check runs are
# named "<caller job's name> / <this job's name>", e.g. "Tests / Group (api)".
name: "Matrix example: filter in a reusable workflow (called)"

on:
  workflow_call:
    inputs:
      # smoke: `mode` only picks where the filter outputs come from.
      mode:
        description: Where the pruning outputs come from
        type: string
        default: simulate
    secrets:
      TRUNK_API_TOKEN:
        description: Your organization's Trunk API token
        required: false
    # smoke: re-exported only so the caller's verdict can read them.
    outputs:
      groups:
        description: The filter's groups output
        value: ${{ jobs.dynamic-ci-filter.outputs.groups }}
      groups-include:
        description: The filter's groups-include output
        value: ${{ jobs.dynamic-ci-filter.outputs.groups-include }}
      groups-result:
        description: The groups job's result
        value: ${{ jobs.tests-pass.outputs.groups-result }}
      areas:
        description: The filter's areas output
        value: ${{ jobs.dynamic-ci-filter.outputs.areas }}
      areas-include:
        description: The filter's areas-include output
        value: ${{ jobs.dynamic-ci-filter.outputs.areas-include }}
      areas-result:
        description: The areas job's result
        value: ${{ jobs.tests-pass.outputs.areas-result }}
      lint:
        description: The filter's lint output
        value: ${{ jobs.dynamic-ci-filter.outputs.lint }}
      lint-include:
        description: The filter's lint-include output
        value: ${{ jobs.dynamic-ci-filter.outputs.lint-include }}
      lint-result:
        description: The lint job's result
        value: ${{ jobs.tests-pass.outputs.lint-result }}

permissions: read-all

# smoke
env:
  MODE: ${{ inputs.mode }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      areas: ${{ steps.plan.outputs.areas }}
      lint: ${{ steps.plan.outputs.lint }}
    steps:
      # smoke: fixed rows, so the answer key knows what to expect.
      - id: plan
        run: |
          groups='[{"name":"api"},{"name":"web"},{"name":"worker"}]'
          areas='[{"area":"area-docs"},{"area":"area-search"},{"area":"area-billing"}]'
          lint='[{"target":"core"},{"target":"cli"}]'
          {
            echo "groups=$(jq -c . <<<"${groups}")"
            echo "areas=$(jq -c . <<<"${areas}")"
            echo "lint=$(jq -c . <<<"${lint}")"
          } >> "${GITHUB_OUTPUT}"

  dynamic-ci-filter:
    name: Dynamic CI Filter
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Trunk decides "<caller>/<job>"; the action also sets each output under the
    # job's own key, which is what the jobs below read.
    # smoke: yours reads steps.ci-filter only; drop each `|| steps.sim.outputs.*`.
    outputs:
      groups: ${{ steps.ci-filter.outputs.groups || steps.sim.outputs.groups }}
      groups-include: ${{ steps.ci-filter.outputs.groups-include || steps.sim.outputs.groups-include }}
      areas: ${{ steps.ci-filter.outputs.areas || steps.sim.outputs.areas }}
      areas-include: ${{ steps.ci-filter.outputs.areas-include || steps.sim.outputs.areas-include }}
      lint: ${{ steps.ci-filter.outputs.lint || steps.sim.outputs.lint }}
      lint-include: ${{ steps.ci-filter.outputs.lint-include || steps.sim.outputs.lint-include }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Run Dynamic CI Filter
        id: ci-filter
        if: env.MODE == 'live' # smoke
        # smoke: yours is trunk-io/dynamic-ci@v1. Live runs are on main, so this is that commit.
        uses: trunk-io/dynamic-ci@main
        with:
          token: ${{ secrets.TRUNK_API_TOKEN }}
          # Keyed by this workflow's own job keys; Trunk reads each as "<caller>/<job>".
          matrices: >-
            {
              "groups": ${{ needs.plan.outputs.groups || '[]' }},
              "areas": ${{ needs.plan.outputs.areas || '[]' }},
              "lint": ${{ needs.plan.outputs.lint || '[]' }}
            }
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io # smoke

      # smoke: in simulate mode, emit the outputs the answer key asks for instead.
      - uses: actions/setup-node@v4
        if: env.MODE != 'live'
        with:
          node-version: "24"
      - id: sim
        if: env.MODE != 'live'
        run: node .github/smoke/matrix/smoke.ts simulate filter-in-reusable-workflow

  groups:
    name: Group (${{ matrix.name }})
    needs: [plan, dynamic-ci-filter]
    # A job with no verdict has no output and runs, so compare against 'false'.
    if: ${{ !cancelled() && needs.dynamic-ci-filter.outputs.groups != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dynamic-ci-filter.outputs.groups-include || needs.plan.outputs.groups) }}
    steps:
      - name: Run tests
        run: echo "Testing ${GROUP}"
        env:
          GROUP: ${{ matrix.name }}

  # A name that is only an expression: GitHub reports each variation under its
  # value alone, e.g. "Tests / area-docs", beside this workflow's other jobs.
  areas:
    name: ${{ matrix.area }}
    needs: [plan, dynamic-ci-filter]
    if: ${{ !cancelled() && needs.dynamic-ci-filter.outputs.areas != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dynamic-ci-filter.outputs.areas-include || needs.plan.outputs.areas) }}
    steps:
      - name: Run tests
        run: echo "Testing ${AREA}"
        env:
          AREA: ${{ matrix.area }}

  # When Trunk skips every variation, the lint output is 'false' and the job is
  # skipped whole, so its matrix is never expanded from an empty include.
  lint:
    name: Lint (${{ matrix.target }})
    needs: [plan, dynamic-ci-filter]
    if: ${{ !cancelled() && needs.dynamic-ci-filter.outputs.lint != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dynamic-ci-filter.outputs.lint-include || needs.plan.outputs.lint) }}
    steps:
      - name: Run lint
        run: echo "Linting ${TARGET}"
        env:
          TARGET: ${{ matrix.target }}

  # The check to require; never gate it, since a skipped gate cannot report.
  tests-pass:
    name: Tests pass
    needs: [groups, areas, lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # smoke
    outputs:
      groups-result: ${{ needs.groups.result }}
      areas-result: ${{ needs.areas.result }}
      lint-result: ${{ needs.lint.result }}
    steps:
      - name: Fail if a gated job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

# Called only by matrix-smoke.yaml's `reusable-inputs` job. Its matrix comes from
# the caller's inputs, which the caller sets to literals: static in effect, but
# not written in this file's matrix. Check runs are named
# "<caller name> / <this job's name>".
name: Matrix Smoke (reusable)

on:
  workflow_call:
    inputs:
      oses:
        description: JSON array of os values
        type: string
        required: true
      exclude:
        description: JSON array of exclude entries, the filter's <job>-exclude output
        type: string
        default: "[]"

permissions: read-all

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
        exclude: ${{ fromJSON(inputs.exclude) }}
    steps:
      - run: echo "${MATRIX}"
        env:
          MATRIX: ${{ toJSON(matrix) }}

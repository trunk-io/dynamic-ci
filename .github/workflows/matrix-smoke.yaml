# The matrix shapes that only test GitHub's own rules: how exclude matches
# numbers, booleans and floats, names that read other contexts, runner-only
# legs, and colliding names. One job per shape; .github/smoke/matrix/fixtures.ts
# is the answer key for each, and the README beside it says what is asserted
# and why. Shapes a customer would copy are in matrix-example-*.yaml, one full
# workflow each.
#
#   mode: simulate  (pull requests, and weekly) the filter job emits the
#                   per-leg pruning outputs the action will emit, from
#                   fixtures.ts. Deterministic: this tests GitHub, and our model
#                   of it. Weekly catches GitHub changing behavior we've pinned.
#   mode: live      (every 4 hours, or dispatch) the real action at this commit,
#                   against staging. Asserts the same invariants whatever staging
#                   decides, and its runs are the CI history staging decides on.
name: Matrix Smoke
run-name: Matrix Smoke (${{ inputs.mode || (github.event.schedule == '17 */4 * * *' && 'live') || 'simulate' }}) for ${{ github.ref_name }}

concurrency:
  group: matrix-smoke-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

on:
  pull_request:
    paths:
      - .github/workflows/matrix-smoke.yaml
      - .github/smoke/matrix/**
  # Schedules run only from the default branch. MODE below tells them apart by
  # cron string, so change both together.
  schedule:
    - cron: 17 */4 * * * # live: builds staging's history for every leg
    - cron: 43 6 * * 1 # simulate: Mondays
  workflow_dispatch:
    inputs:
      mode:
        description: Where the pruning outputs come from
        type: choice
        options: [simulate, live]
        default: simulate

env:
  MODE: ${{ inputs.mode || (github.event.schedule == '17 */4 * * *' && 'live') || 'simulate' }}

jobs:
  # A planner job: builds the rows its workflow's runtime matrices are made of.
  planner:
    name: Planner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name-collision-rows: ${{ steps.rows.outputs.name-collision-rows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: rows
        run: node .github/smoke/matrix/smoke.ts planner

  # The pre-job filter, exactly as the README recommends: one job whose outputs
  # every gated job reads. It runs after the planner because runtime matrices
  # hand it their rows (`matrices`).
  filter:
    name: Dynamic CI filter
    needs: [planner]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # trunk-ignore-begin(actionlint/expression): per-job outputs are set at runtime
    # and so cannot be declared in action.yaml. Only one of `live` and `sim` runs.
    outputs:
      number-exclude: ${{ steps.live.outputs.number-exclude || steps.sim.outputs.number-exclude }}
      number-exclude-exclude: ${{ steps.live.outputs.number-exclude-exclude || steps.sim.outputs.number-exclude-exclude }}
      bool-exclude: ${{ steps.live.outputs.bool-exclude || steps.sim.outputs.bool-exclude }}
      bool-exclude-exclude: ${{ steps.live.outputs.bool-exclude-exclude || steps.sim.outputs.bool-exclude-exclude }}
      float-values: ${{ steps.live.outputs.float-values || steps.sim.outputs.float-values }}
      float-exclude: ${{ steps.live.outputs.float-exclude || steps.sim.outputs.float-exclude }}
      float-exclude-exclude: ${{ steps.live.outputs.float-exclude-exclude || steps.sim.outputs.float-exclude-exclude }}
      context-name: ${{ steps.live.outputs.context-name || steps.sim.outputs.context-name }}
      context-name-exclude: ${{ steps.live.outputs.context-name-exclude || steps.sim.outputs.context-name-exclude }}
      runs-on-include: ${{ steps.live.outputs.runs-on-include || steps.sim.outputs.runs-on-include }}
      name-collision: ${{ steps.live.outputs.name-collision || steps.sim.outputs.name-collision }}
      name-collision-matrix: ${{ steps.live.outputs.name-collision-matrix || steps.sim.outputs.name-collision-matrix }}
    # trunk-ignore-end(actionlint/expression)
    steps:
      - uses: actions/checkout@v4

      - id: live
        if: env.MODE == 'live'
        continue-on-error: true
        uses: ./
        with:
          token: ${{ secrets.TRUNK_STAGING_DYNAMIC_CI_TOKEN }}
          # job key -> the rows its runtime matrix is built from. Which fields
          # identify a variant is configured in Trunk, not here.
          matrices: >-
            {"name-collision": ${{ needs.planner.outputs.name-collision-rows || '[]' }}}
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io

      - uses: actions/setup-node@v4
        if: env.MODE != 'live'
        with:
          node-version: "24"
      - id: sim
        if: env.MODE != 'live'
        run: node .github/smoke/matrix/smoke.ts simulate

  # ---------------------------------------------------------------------------
  # Static matrices: every value is written here. Every fixture's legs only echo
  # their matrix; what is under test is which legs GitHub creates and what it
  # names them.
  # ---------------------------------------------------------------------------

  # A number axis excluded by the STRING "18", as a service that stored the
  # values as text would return it.
  number-exclude:
    name: Number · node ${{ matrix.node }}
    needs: [filter]
    if: ${{ !cancelled() && needs.filter.outputs.number-exclude != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
        exclude: ${{ fromJSON(needs.filter.outputs.number-exclude-exclude || '[]') }}
    steps:
      - run: echo "${MATRIX}"
        env:
          MATRIX: ${{ toJSON(matrix) }}

  # A boolean axis excluded by the STRING "false". Observed: it does not match,
  # so pruning outputs must keep their JSON types.
  bool-exclude:
    name: Bool · flag ${{ matrix.flag }}
    needs: [filter]
    if: ${{ !cancelled() && needs.filter.outputs.bool-exclude != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        flag: [true, false]
        exclude: ${{ fromJSON(needs.filter.outputs.bool-exclude-exclude || '[]') }}
    steps:
      - run: echo "${MATRIX}"
        env:
          MATRIX: ${{ toJSON(matrix) }}

  # 3.10 unquoted is the number 3.1; "3.10" quoted is a string. Nothing is
  # excluded: this is the control that says which legs exist at all.
  float-values:
    name: Floats · Python ${{ matrix.python }}
    needs: [filter]
    if: ${{ !cancelled() && needs.filter.outputs.float-values != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # trunk-ignore(actionlint/matrix): 3.10 and "3.10" differ on purpose — that is the probe
        python: [3.9, 3.10, "3.10"]
    steps:
      - run: echo "${MATRIX}"
        env:
          MATRIX: ${{ toJSON(matrix) }}

  # The same axis, excluding "3.10". Observed: the number 3.1 goes too.
  float-exclude:
    name: Float exclude · Python ${{ matrix.python }}
    needs: [filter]
    if: ${{ !cancelled() && needs.filter.outputs.float-exclude != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # trunk-ignore(actionlint/matrix): 3.10 and "3.10" differ on purpose — that is the probe
        python: [3.9, 3.10, "3.10"]
        exclude: ${{ fromJSON(needs.filter.outputs.float-exclude-exclude || '[]') }}
    steps:
      - run: echo "${MATRIX}"
        env:
          MATRIX: ${{ toJSON(matrix) }}

  # name: reads a context other than matrix, so the name can't be rendered from
  # the matrix values alone.
  context-name:
    name: Context · ${{ matrix.os }} in ${{ github.workflow }}
    needs: [filter]
    if: ${{ !cancelled() && needs.filter.outputs.context-name != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
        exclude: ${{ fromJSON(needs.filter.outputs.context-name-exclude || '[]') }}
    steps:
      - run: echo "${MATRIX}"
        env:
          MATRIX: ${{ toJSON(matrix) }}

  # No name:, include-only, runs-on from the matrix: legs told apart only by
  # their runner and values. Unwired: the job can only be skipped whole.
  runs-on-include:
    needs: [filter]
    if: ${{ !cancelled() && needs.filter.outputs.runs-on-include != 'false' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-22.04
            arch: amd64-jammy
    steps:
      - run: echo "${MATRIX}"
        env:
          MATRIX: ${{ toJSON(matrix) }}

  # ---------------------------------------------------------------------------
  # Runtime matrices: the rows come from the planner job.
  # ---------------------------------------------------------------------------

  # Two rows render the same name, so the legs can't be told apart once they've
  # run; pruning by row still works.
  name-collision:
    name: Collision · ${{ matrix.suite }}
    needs: [planner, filter]
    if: ${{ !cancelled() && needs.filter.outputs.name-collision != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.filter.outputs.name-collision-matrix || format('{{"include":{0}}}', needs.planner.outputs.name-collision-rows)) }}
    steps:
      - run: echo "${MATRIX}"
        env:
          MATRIX: ${{ toJSON(matrix) }}

  # ---------------------------------------------------------------------------
  # Did GitHub create exactly the legs the outputs kept, under the predicted names?
  # ---------------------------------------------------------------------------
  verdict:
    name: Verdict
    needs:
      - planner
      - filter
      - number-exclude
      - bool-exclude
      - float-values
      - float-exclude
      - context-name
      - runs-on-include
      - name-collision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compare the check runs against fixtures.ts
        id: verdict
        continue-on-error: true
        run: node .github/smoke/matrix/smoke.ts verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}

      # observed.json is the golden data: every name GitHub rendered, per fixture.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: matrix-smoke-out
          path: matrix-smoke-out/

      - name: Trunk Analytics Uploader (Staging)
        if: ${{ !cancelled() }}
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: matrix-smoke-out/junit.xml
          org-slug: trunk-staging-org
          token: ${{ secrets.TRUNK_STAGING_ORG_API_TOKEN }}
          allow-missing-junit-files: false
          previous-step-outcome: ${{ steps.verdict.outcome }}
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io

      # The uploader re-fails the job too, but only with a token; a fork has none.
      - name: Fail if the verdict failed
        if: ${{ steps.verdict.outcome == 'failure' }}
        run: exit 1

  # The fan-in job: the one check a repository should require instead of any
  # leg's. Never gate it — a gate that can be skipped cannot report.
  matrix-smoke-pass:
    name: Matrix Smoke Pass
    needs: [verdict]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[[ "${{ needs.verdict.result }}" == success ]]'

# The reusable workflow matrix-example-reusable-workflow.yaml calls. Its matrix
# comes from the caller's inputs: the values to run over, and the variations
# Trunk skipped. Check runs are named "<caller job's name> / <this job's name>",
# e.g. "Unit / Test (linux)".
name: "Matrix example: reusable workflow (called)"

on:
  workflow_call:
    inputs:
      oses:
        description: JSON array of os values
        type: string
        required: true
      exclude:
        description: JSON array of exclude entries, the filter's <job>-exclude output
        type: string
        default: "[]"

permissions: read-all

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
        # The variations Trunk skipped, passed through by the caller.
        exclude: ${{ fromJSON(inputs.exclude) }}
    steps:
      - name: Run tests
        run: echo "Testing on ${OS}"
        env:
          OS: ${{ matrix.os }}

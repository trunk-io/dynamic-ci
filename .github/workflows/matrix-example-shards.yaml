# Example: a test matrix split into shards, where Trunk skips a whole suite
# with all of its shards.
#
# Use this shape when each suite runs as a fixed number of shards declared as an
# axis, like suite × shard below. Each (suite, shard) is a matrix variation,
# and GitHub runs each as its own job.
#
# What to configure in Trunk
#   Nothing in this file opts a job into per-variation verdicts. In Trunk, each
#   matrix job lists its variation dimensions: the matrix keys that tell its
#   variations apart.
#     test    suite   (not shard: a shard is a slice of its suite's tests, so
#                     Trunk decides the suite and every shard follows)
#   A job with no dimensions configured gets one verdict for the whole matrix.
#
# What the filter emits for each matrix job
#   test           'false' when every variation is skipped, otherwise 'true'
#   test-exclude   the variations to skip, by suite alone, e.g.
#                  [{"suite":"integration"}]. An exclude entry that leaves out
#                  shard matches every shard, so the whole suite is skipped.
#   GitHub never creates an excluded variation's job, so it costs nothing and
#   reports nothing.
#
# Required checks
#   Require "Tests pass", never one variation's check. A skipped variation never
#   reports, and a matrix skipped whole reports one check under its unexpanded
#   name.
#
# This file is also a smoke test of how GitHub handles those outputs. Whatever
# is marked `smoke:` is the test's harness: leave it out of your workflow.
# .github/smoke/matrix/README.md says what the test asserts, and
# .github/smoke/matrix/examples/shards.ts is its answer key.
name: "Matrix example: shards"
# smoke: the mode says where the filter's outputs come from (see the README).
run-name: Matrix example shards (${{ inputs.mode || (github.event.schedule == '11 */4 * * *' && 'live') || 'simulate' }}) for ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

on:
  # smoke: yours would run on every pull request.
  pull_request:
    paths:
      - .github/workflows/matrix-example-shards.yaml
      - .github/smoke/matrix/**
  # smoke: schedules run only from the default branch. MODE below tells them
  # apart by cron string, so change both together.
  schedule:
    - cron: 11 */4 * * * # live: builds staging's history for every leg
    - cron: 43 6 * * 1 # simulate: Mondays
  workflow_dispatch:
    inputs:
      mode:
        description: Where the pruning outputs come from
        type: choice
        options: [simulate, live]
        default: simulate

# smoke
env:
  MODE: ${{ inputs.mode || (github.event.schedule == '11 */4 * * *' && 'live') || 'simulate' }}

jobs:
  dynamic-ci-filter:
    name: Dynamic CI Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Per-job outputs are set at runtime, so re-export each one by name.
    # smoke: yours reads steps.ci-filter only; drop each `|| steps.sim.outputs.*`.
    # trunk-ignore-begin(actionlint/expression): per-job outputs are set at runtime
    # and so cannot be declared in action.yaml.
    outputs:
      test: ${{ steps.ci-filter.outputs.test || steps.sim.outputs.test }}
      test-exclude: ${{ steps.ci-filter.outputs.test-exclude || steps.sim.outputs.test-exclude }}
    # trunk-ignore-end(actionlint/expression)
    steps:
      # Check out first, with full history, so the action can read the changed files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Run Dynamic CI Filter
        id: ci-filter
        if: env.MODE == 'live' # smoke
        # smoke: yours is trunk-io/dynamic-ci-filter@v1; this is the action at this commit.
        uses: ./
        with:
          # smoke: yours is your organization's token, secrets.TRUNK_API_TOKEN.
          token: ${{ secrets.TRUNK_STAGING_DYNAMIC_CI_TOKEN }}
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io # smoke

      # smoke: in simulate mode, emit the outputs the answer key asks for instead.
      - uses: actions/setup-node@v4
        if: env.MODE != 'live'
        with:
          node-version: "24"
      - id: sim
        if: env.MODE != 'live'
        run: node .github/smoke/matrix/smoke.ts simulate shards

  test:
    name: Test ${{ matrix.suite }} (${{ matrix.shard }}/2)
    needs: [dynamic-ci-filter]
    # Always compare against 'false'. A job with no verdict (an outage, a job
    # Trunk hasn't seen yet) has no output, and runs.
    if: ${{ !cancelled() && needs.dynamic-ci-filter.outputs.test != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
        shard: [1, 2]
        # The variations Trunk skipped. With no output, `|| '[]'` runs them all.
        exclude: ${{ fromJSON(needs.dynamic-ci-filter.outputs.test-exclude || '[]') }}
    steps:
      - name: Run tests
        run: echo "Testing ${SUITE} shard ${SHARD} of 2"
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}

  # The fan-in job, and the one check to require. It passes when every gated job
  # succeeded or was skipped. Never gate it: a gate that can be skipped cannot
  # report.
  tests-pass:
    name: Tests pass
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a gated job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # ---------------------------------------------------------------------------
  # smoke: everything below is the smoke test, not part of the example.
  # Did GitHub create exactly the legs the outputs kept, under the predicted names?
  # ---------------------------------------------------------------------------
  verdict:
    name: Smoke verdict
    needs: [dynamic-ci-filter, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compare the check runs against the answer key
        id: verdict
        continue-on-error: true
        run: node .github/smoke/matrix/smoke.ts verdict shards
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}

      # observed.json is the golden data: every name GitHub rendered, per job.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: matrix-smoke-out
          path: matrix-smoke-out/

      - name: Trunk Analytics Uploader (Staging)
        if: ${{ !cancelled() }}
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: matrix-smoke-out/junit.xml
          org-slug: trunk-staging-org
          token: ${{ secrets.TRUNK_STAGING_ORG_API_TOKEN }}
          allow-missing-junit-files: false
          previous-step-outcome: ${{ steps.verdict.outcome }}
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io

      # The uploader re-fails the job too, but only with a token; a fork has none.
      - name: Fail if the verdict failed
        if: ${{ steps.verdict.outcome == 'failure' }}
        run: exit 1

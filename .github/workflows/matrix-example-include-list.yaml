# Example: a matrix written as an `include` list, where Trunk skips
# individual matrix variations.
#
# Use this shape when the variations don't form a grid, so each is written out
# as its own row: one parallel lane, and a serial lane in three shards.
# Each row is a matrix variation, and GitHub runs each as its own job.
#
# Write the rows as the fallback
#   GitHub can't exclude from an include-only matrix, so the filter emits the
#   whole matrix minus the skipped rows instead. The rows you write become the
#   fallback in fromJSON(<job>-matrix || '<your rows>'), which GitHub uses
#   whenever the filter emits nothing.
#
# What to configure in Trunk
#   Nothing in this file opts a job into per-variation verdicts. In Trunk, each
#   matrix job lists its variation dimensions: the row fields that tell its
#   variations apart.
#     test          lane   (Trunk decides a lane, and each of its shards follows)
#     integration   lane
#   A job with no dimensions configured gets one verdict for the whole matrix.
#
# What the filter emits for each matrix job
#   test          'false' when every row is skipped, otherwise 'true'
#   test-matrix   the whole matrix, minus the skipped rows: {"include":[...]}
#   GitHub never creates a job for a row that was removed, so it costs nothing
#   and reports nothing.
#
# When every row is skipped
#   <job> is 'false' and <job>-matrix is {"include":[]}. GitHub fails a job
#   whose matrix is empty, so the `if:` must skip the job first, as it does
#   for `integration` here. The skipped job reports one check under its
#   unexpanded name.
#
# Required checks
#   Require "Tests pass", never one variation's check. A skipped variation never
#   reports, and a matrix skipped whole reports one check under its unexpanded
#   name.
#
# This file is also a smoke test of how GitHub handles those outputs. Whatever
# is marked `smoke:` is the test's harness: leave it out of your workflow.
# .github/smoke/matrix/README.md says what the test asserts, and
# .github/smoke/matrix/examples/include-list.ts is its answer key.
name: "Matrix example: include list"
# smoke: the mode says where the filter's outputs come from (see the README).
run-name: Matrix example include-list (${{ inputs.mode || (github.event.schedule == '41 */4 * * *' && 'live') || 'simulate' }}) for ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

on:
  # smoke: yours would run on every pull request.
  pull_request:
    paths:
      - .github/workflows/matrix-example-include-list.yaml
      - .github/smoke/matrix/**
  # smoke: schedules run only from the default branch. MODE below tells them
  # apart by cron string, so change both together.
  schedule:
    - cron: 41 */4 * * * # live: builds staging's history for every leg
    - cron: 43 6 * * 1 # simulate: Mondays
  workflow_dispatch:
    inputs:
      # smoke: `mode` only picks where the filter outputs come from.
      # trunk-ignore(checkov/CKV_GHA_7)
      mode:
        description: Where the pruning outputs come from
        type: choice
        options: [simulate, live]
        default: simulate

# smoke
env:
  MODE: ${{ inputs.mode || (github.event.schedule == '41 */4 * * *' && 'live') || 'simulate' }}

jobs:
  dynamic-ci-filter:
    name: Dynamic CI Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Per-job outputs are set at runtime, so re-export each one by name.
    # smoke: yours reads steps.ci-filter only; drop each `|| steps.sim.outputs.*`.
    # trunk-ignore-begin(actionlint/expression): per-job outputs are set at runtime
    # and so cannot be declared in action.yaml.
    outputs:
      test: ${{ steps.ci-filter.outputs.test || steps.sim.outputs.test }}
      test-matrix: ${{ steps.ci-filter.outputs.test-matrix || steps.sim.outputs.test-matrix }}
      integration: ${{ steps.ci-filter.outputs.integration || steps.sim.outputs.integration }}
      integration-matrix: ${{ steps.ci-filter.outputs.integration-matrix || steps.sim.outputs.integration-matrix }}
    # trunk-ignore-end(actionlint/expression)
    steps:
      # Check out first, with full history, so the action can read the changed files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Run Dynamic CI Filter
        id: ci-filter
        if: env.MODE == 'live' # smoke
        # smoke: yours is trunk-io/dynamic-ci-filter@v1; this is the action at this commit.
        uses: ./
        with:
          # smoke: yours is your organization's token, secrets.TRUNK_API_TOKEN.
          token: ${{ secrets.TRUNK_STAGING_DYNAMIC_CI_TOKEN }}
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io # smoke

      # smoke: in simulate mode, emit the outputs the answer key asks for instead.
      - uses: actions/setup-node@v4
        if: env.MODE != 'live'
        with:
          node-version: "24"
      - id: sim
        if: env.MODE != 'live'
        run: node .github/smoke/matrix/smoke.ts simulate include-list

  test:
    name: Tests (${{ matrix.lane }} ${{ matrix.shard }}/${{ matrix.shard_count }})
    needs: [dynamic-ci-filter]
    # Always compare against 'false'. A job with no verdict (an outage, a job
    # Trunk hasn't seen yet) has no output, and runs.
    if: ${{ !cancelled() && needs.dynamic-ci-filter.outputs.test != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # The filter's matrix, with the skipped rows removed. With no output, every
      # row in the fallback runs.
      matrix: ${{ fromJSON(needs.dynamic-ci-filter.outputs.test-matrix || '{"include":[{"lane":"parallel","shard":1,"shard_count":1},{"lane":"serial","shard":1,"shard_count":3},{"lane":"serial","shard":2,"shard_count":3},{"lane":"serial","shard":3,"shard_count":3}]}') }}
    steps:
      - name: Run tests
        run: echo "Testing the ${LANE} lane, shard ${SHARD} of ${SHARD_COUNT}"
        env:
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ matrix.shard_count }}

  # smoke: Trunk skips every row of this job, to show the `if:` doing its work.
  integration:
    name: Integration (${{ matrix.lane }})
    needs: [dynamic-ci-filter]
    # Required here: with every row skipped, the matrix below is empty.
    if: ${{ !cancelled() && needs.dynamic-ci-filter.outputs.integration != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dynamic-ci-filter.outputs.integration-matrix || '{"include":[{"lane":"parallel"},{"lane":"serial"}]}') }}
    steps:
      - name: Run integration tests
        run: echo "Integration tests, ${LANE} lane"
        env:
          LANE: ${{ matrix.lane }}

  # The fan-in job, and the one check to require. It passes when every gated job
  # succeeded or was skipped. Never gate it: a gate that can be skipped cannot
  # report.
  tests-pass:
    name: Tests pass
    needs: [test, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a gated job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # ---------------------------------------------------------------------------
  # smoke: everything below is the smoke test, not part of the example.
  # Did GitHub create exactly the legs the outputs kept, under the predicted names?
  # ---------------------------------------------------------------------------
  verdict:
    name: Smoke verdict
    needs: [dynamic-ci-filter, test, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compare the check runs against the answer key
        id: verdict
        continue-on-error: true
        run: node .github/smoke/matrix/smoke.ts verdict include-list
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}

      # observed.json is the golden data: every name GitHub rendered, per job.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: matrix-smoke-out
          path: matrix-smoke-out/

      - name: Trunk Analytics Uploader (Staging)
        if: ${{ !cancelled() }}
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: matrix-smoke-out/junit.xml
          org-slug: trunk-staging-org
          token: ${{ secrets.TRUNK_STAGING_ORG_API_TOKEN }}
          allow-missing-junit-files: false
          previous-step-outcome: ${{ steps.verdict.outcome }}
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io

      # The uploader re-fails the job too, but only with a token; a fork has none.
      - name: Fail if the verdict failed
        if: ${{ steps.verdict.outcome == 'failure' }}
        run: exit 1
